name: Release 1.1.6 AAB

on:
  push:
    branches:
      - main

jobs:
  build-play-aab:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Decode release keystore
        env:
          PLANIM_KEYSTORE_B64: ${{ secrets.PLANIM_KEYSTORE_B64 }}
        run: |
          test -n "$PLANIM_KEYSTORE_B64" || (echo "Missing PLANIM_KEYSTORE_B64 secret" && exit 1)
          printf '%s' "$PLANIM_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/planim-release.jks"

      - name: Build signed release AAB
        env:
          PLANIM_KEYSTORE_PATH: ${{ runner.temp }}/planim-release.jks
          PLANIM_KEYSTORE_PASSWORD: ${{ secrets.PLANIM_KEYSTORE_PASSWORD }}
          PLANIM_KEY_ALIAS: ${{ secrets.PLANIM_KEY_ALIAS }}
          PLANIM_KEY_PASSWORD: ${{ secrets.PLANIM_KEY_PASSWORD }}
        run: gradle :app:bundleRelease

      - name: Verify bundle signature
        run: jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab

      - name: Upload Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: Planim-play-aab-1.1.6
          path: app/build/outputs/bundle/release/app-release.aab
